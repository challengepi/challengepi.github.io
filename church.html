<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Catholic Church — Gallery (VR)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#120a0a" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f0f12; --bg-2:#0a0a0c; --txt:#fffaf2; --muted:#d8c9c0; --glass:rgba(255,255,255,0.08); --glass-bd:rgba(255,255,255,0.18);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--txt);
      background: linear-gradient(180deg, #16161a 0%, var(--bg-2) 60%);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      overflow:hidden;
    }
    #scene-wrap{position:fixed; inset:0}
    canvas{touch-action:none}

    .panel{
      position:fixed; right:16px; top:16px; z-index:5;
      background:var(--glass); backdrop-filter: blur(10px);
      border:1px solid var(--glass-bd); border-radius:14px; padding:12px 14px; min-width:220px;
      box-shadow:0 6px 30px rgba(0,0,0,0.35);
    }
    .panel h3{font:700 14px Orbitron,Inter,sans-serif; letter-spacing:1.5px; margin:0 0 8px; color:#ffd27a}
    .row{display:flex; gap:10px; align-items:center; margin:8px 0}
    .btn{
      appearance:none; border:1px solid var(--glass-bd); background:rgba(255,255,255,0.06);
      color:var(--txt); border-radius:12px; font:600 13px Inter,system-ui; padding:8px 12px; cursor:pointer;
    }
    .hint{font-size:12px; color:var(--muted); margin-top:4px}

    .title{ position:fixed; left:50%; top:24px; transform:translateX(-50%);
      font:700 16px Orbitron,Inter,sans-serif; letter-spacing:2px; text-transform:uppercase;
      color:var(--muted); opacity:0.9; z-index:4; display:none; }
    @media (min-width: 860px){ .title{display:block;} }
  </style>
</head>
<body>
  <div id="scene-wrap"></div>

  <div class="title">Catholic Church — Gallery</div>

  <div class="panel" id="panel">
    <h3>VR</h3>
    <div class="row">
      <button class="btn" id="vrBtn">Enter VR</button>
    </div>
    <div class="hint">WebXR works in Chrome/Edge (Android) and Quest Browser.</div>
  </div>

  <script type="module">
    // Local module paths (same as your project)
    import * as THREE from '/three3.js';
    import { OrbitControls } from '/orbit.js';

    const IS_MOBILE = /Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(navigator.userAgent) || (window.matchMedia && matchMedia('(pointer:coarse)').matches);

    // Core
    let scene, camera, renderer, controls, floor;
    const raycaster = new THREE.Raycaster();
    const pointer   = new THREE.Vector2();

    // Renderer
    const wrap = document.getElementById('scene-wrap');
    renderer = new THREE.WebGLRenderer({ antialias: !IS_MOBILE, alpha: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(IS_MOBILE ? Math.min(devicePixelRatio, 1.5) : Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = !IS_MOBILE;
    if (!IS_MOBILE && THREE.PCFSoftShadowMap) renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);
    renderer.domElement.style.touchAction = 'none';

    // WebXR
    renderer.xr.enabled = true;

    // Scene + camera + controls
    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0a0a0d, 28, 160);

    camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
    camera.position.set(0, 1.6, 12);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.06;
    controls.enablePan = true; controls.screenSpacePanning = true;
    controls.rotateSpeed = 0.9; controls.zoomSpeed = 0.8; controls.panSpeed = 0.6;
    controls.minDistance = 1.2; controls.maxDistance = 80.0; controls.maxPolarAngle = Math.PI * 0.49;
    controls.target.set(0, 1.3, -10);
    if ('zoomToCursor' in controls) controls.zoomToCursor = true;

    // XR rig
    const xrRig = new THREE.Group();
    scene.add(xrRig);
    xrRig.add(camera);

    renderer.xr.addEventListener('sessionstart', ()=>{ controls.enabled = false; });
    renderer.xr.addEventListener('sessionend',   ()=>{ controls.enabled = true;  });

    addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ========== LIGHTING ==========
    scene.add(new THREE.AmbientLight(0xf2efe9, 0.24));
    const hemi = new THREE.HemisphereLight(0xffffff, 0x1a1a20, IS_MOBILE ? 0.25 : 0.18);
    scene.add(hemi);

    const overhead = new THREE.SpotLight(0xffffff, 0.55, 0, Math.PI/5, 0.35, 1.4);
    overhead.position.set(0, 6.8, -8);
    overhead.castShadow = !IS_MOBILE; scene.add(overhead);
    const overhead2 = overhead.clone(); overhead2.position.set(0, 6.8, -24); scene.add(overhead2);

    // ========== ARCHITECTURE ==========
    function makeMarble(size=1024, tiles=8){
      const c = document.createElement('canvas'); c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#e7e3dd'; ctx.fillRect(0,0,size,size);
      ctx.globalAlpha = 0.08;
      for (let i=0;i<50;i++){
        const x = Math.random()*size, y=Math.random()*size, r=40+Math.random()*160;
        const g = ctx.createRadialGradient(x,y,0,x,y,r);
        g.addColorStop(0, 'rgba(80,80,90,0.8)');
        g.addColorStop(1, 'rgba(80,80,90,0)');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 0.35; ctx.strokeStyle = 'rgba(30,30,35,0.25)'; ctx.lineWidth = 2;
      const step = size/tiles;
      for (let i=1;i<tiles;i++){
        ctx.beginPath(); ctx.moveTo(i*step,0); ctx.lineTo(i*step,size); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,i*step); ctx.lineTo(size,i*step); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(4,12);
      tex.anisotropy = 4; return tex;
    }

    const hall = new THREE.Mesh(
      new THREE.BoxGeometry(26, 10, 80),
      new THREE.MeshStandardMaterial({ color:0x1b1b1f, roughness:0.95, metalness:0.05, side:THREE.BackSide })
    );
    scene.add(hall);

    floor = new THREE.Mesh(
      new THREE.PlaneGeometry(50, 160),
      new THREE.MeshStandardMaterial({ map: makeMarble(), roughness:0.85, metalness:0.05 })
    );
    floor.rotation.x = -Math.PI/2; floor.receiveShadow = !IS_MOBILE; scene.add(floor);

    function addColumn(x,z){
      const colMat = new THREE.MeshStandardMaterial({ color:0xdddddd, roughness:0.8, metalness:0.05 });
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.42,7.2,16), colMat);
      const base  = new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.6,0.3,16), colMat);
      const cap   = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.52,0.3,16), colMat);
      shaft.position.set(x, 3.8, z); base.position.set(x, 0.15, z); cap.position.set(x, 7.1, z);
      shaft.castShadow = cap.castShadow = base.receiveShadow = !IS_MOBILE;
      scene.add(shaft, base, cap);
    }
    function addArch(a, b){
      const span = new THREE.Vector3().subVectors(b, a); const mid = new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5);
      const len = span.length();
      const arc = new THREE.Mesh(
        new THREE.TorusGeometry(len*0.5, 0.18, 12, 48, Math.PI),
        new THREE.MeshStandardMaterial({ color:0xdddddd, roughness:0.8, metalness:0.05 })
      );
      arc.rotation.set(0, Math.atan2(span.z, span.x)+Math.PI, Math.PI);
      arc.position.set(mid.x, 7.1, mid.z);
      arc.castShadow = !IS_MOBILE; scene.add(arc);
    }

    const colPairsZ = [-6, -18, -30, -42, -54];
    colPairsZ.forEach(z=>{
      addColumn(-10, z); addColumn(10, z);
      addArch(new THREE.Vector3(-10,7.1,z), new THREE.Vector3(10,7.1,z));
    });

    function addSconce(x,y,z){
      const back = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.22,0.1,12), new THREE.MeshStandardMaterial({ color:0x333336, roughness:0.6 }));
      back.rotation.z = Math.PI/2; back.position.set(x,y,z);
      const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 8, 0, Math.PI), new THREE.MeshStandardMaterial({ color:0xf7f2d6, emissive:0xf0e7c2, emissiveIntensity:0.6, roughness:0.5 }));
      bowl.rotation.x = Math.PI; bowl.position.set(x,y,z+0.05);
      const light = new THREE.PointLight(0xfff2c4, 0.9, 10, 2.0); light.position.set(x,y,z+0.05);
      scene.add(back, bowl, light);
    }
    for (let i=0;i<colPairsZ.length;i++){
      addSconce(-8.5, 3.6, colPairsZ[i]+0.2);
      addSconce( 8.5, 3.6, colPairsZ[i]+0.2);
    }

    // ===== Stained-glass side panels (cathedral vibe) =====
    function makeStainedGlassTex(){
      const c = document.createElement('canvas'); c.width = 256; c.height = 512;
      const g = c.getContext('2d');
      g.fillStyle = '#0a0a0d'; g.fillRect(0,0,c.width,c.height);
      // mosaic blocks
      const cols = 8, rows = 16;
      for (let y=0;y<rows;y++){
        for (let x=0;x<cols;x++){
          const hue = (x*30 + y*12) % 360;
          g.fillStyle = `hsla(${hue}, 70%, 55%, 0.85)`;
          g.fillRect(x*(c.width/cols)+2, y*(c.height/rows)+2, (c.width/cols)-4, (c.height/rows)-4);
        }
      }
      // lead lines
      g.strokeStyle = 'rgba(10,10,10,0.7)';
      g.lineWidth = 6;
      for (let x=0;x<=cols;x++){
        g.beginPath(); g.moveTo(x*(c.width/cols),0); g.lineTo(x*(c.width/cols),c.height); g.stroke();
      }
      for (let y=0;y<=rows;y++){
        g.beginPath(); g.moveTo(0,y*(c.height/rows)); g.lineTo(c.width,y*(c.height/rows)); g.stroke();
      }
      // simple cross motif
      g.globalAlpha = 0.85;
      g.fillStyle = 'rgba(255,245,215,0.9)';
      g.fillRect(118, 170, 20, 170);
      g.fillRect(82, 230, 92, 20);

      const tex = new THREE.CanvasTexture(c);
      tex.anisotropy = 4;
      return tex;
    }
    const stainedTex = makeStainedGlassTex();
    const glassMat = new THREE.MeshStandardMaterial({ map: stainedTex, emissive:0x222222, emissiveIntensity:0.6, roughness:0.7, metalness:0.0 });
    function addGlassPanel(x,z){
      const panel = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 4.2), glassMat);
      panel.position.set(x, 3.2, z);
      panel.rotation.y = (x < 0) ? Math.PI/2 : -Math.PI/2;
      scene.add(panel);
    }
    [-12,-24,-36,-48].forEach(z=>{ addGlassPanel(-12.6,z); addGlassPanel(12.6,z); });

    // ========== LABEL HELPERS ==========
    function makeLabel(text) {
      const c = document.createElement('canvas'), p=16, fs=34;
      const ctx = c.getContext('2d');
      ctx.font = `bold ${fs}px Inter, Arial`;
      const w = Math.ceil(ctx.measureText(text).width) + p*2; const h = fs + p*2;
      c.width = w; c.height = h; const c2 = c.getContext('2d'); c2.font = `bold ${fs}px Inter, Arial`;
      c2.fillStyle='rgba(24,12,20,0.85)'; c2.strokeStyle='rgba(255,255,255,0.25)'; c2.lineWidth=4;
      c2.beginPath(); const r=18; c2.moveTo(r,0); c2.arcTo(w,0,w,h,r); c2.arcTo(w,h,0,h,r); c2.arcTo(0,h,0,0,r); c2.arcTo(0,0,w,0,r); c2.closePath();
      c2.fill(); c2.stroke();
      c2.fillStyle='#fff6e9'; c2.textAlign='center'; c2.textBaseline='middle'; c2.fillText(text,w/2,h/2);
      const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent:true, depthWrite:false }));
      const s=0.008; spr.scale.set(w*s, h*s, 1); return spr;
    }
    function makeSub(text){
      const c = document.createElement('canvas'), p=12, fs=22; const ctx = c.getContext('2d');
      ctx.font = `600 ${fs}px Inter, Arial`; const w = Math.ceil(ctx.measureText(text).width) + p*2; const h = fs + p*2; c.width = w; c.height = h;
      const g = c.getContext('2d'); g.font = `600 ${fs}px Inter, Arial`; g.fillStyle='rgba(255,255,255,0.78)'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,w/2,h/2);
      const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent:true, depthWrite:false }));
      const s=0.006; spr.scale.set(w*s, h*s, 1); return spr;
    }

    function makePedestal({wTop=0.75,wBot=0.85,h=0.6}={}){
      const grp = new THREE.Group();
      const stone = new THREE.MeshStandardMaterial({ color:0xb8b3ab, roughness:0.75, metalness:0.05 });
      const base  = new THREE.Mesh(new THREE.CylinderGeometry(wBot,wBot,0.12,24), stone);
      const core  = new THREE.Mesh(new THREE.CylinderGeometry(wTop,wTop, h,24), stone);
      const cap   = new THREE.Mesh(new THREE.CylinderGeometry(wTop*0.95, wTop*0.95,0.06,24), stone);
      base.position.y = 0.06; core.position.y = h*0.5+0.12; cap.position.y = h+0.15;
      [base,core,cap].forEach(m=>{ m.receiveShadow = !IS_MOBILE; m.castShadow = !IS_MOBILE; });
      grp.add(base,core,cap); grp.userData.topY = cap.position.y+0.03;
      return grp;
    }

    function addExhibit({ name, sub, pos = {x:0,y:0,z:0}, buildMesh, spotlight=true } = {}) {
      const group = new THREE.Group();
      group.position.set(pos.x||0, pos.y||0, pos.z||0);

      const pedestal = makePedestal(); group.add(pedestal);
      const builder = (typeof buildMesh === 'function') ? buildMesh : ()=> new THREE.Group();
      let mesh = builder();
      if (!mesh || !(mesh && mesh.isObject3D)) { console.warn('[addExhibit] buildMesh did not return Object3D for', name); mesh = new THREE.Group(); }
      mesh.position.y = pedestal.userData.topY || 0.95;
      if (mesh.castShadow !== undefined){ mesh.castShadow = !IS_MOBILE; mesh.receiveShadow = !IS_MOBILE; }
      group.add(mesh);

      const label = makeLabel(name); label.position.set(0, (pedestal.userData.topY||1.0)+0.85, 0); group.add(label);
      if (sub){ const l2 = makeSub(sub); l2.position.set(0, (pedestal.userData.topY||1.0)+0.55, 0); group.add(l2); }

      if (!IS_MOBILE && spotlight){
        const spot = new THREE.SpotLight(0xffffff, 0.85, 8, Math.PI/8, 0.4, 1.6);
        spot.position.set(group.position.x+0.8, 4.8, group.position.z+0.8);
        spot.target = mesh; spot.castShadow = true; group.add(spot, spot.target);
      }
      scene.add(group); return group;
    }

    // Materials
    function goldMaterial(){ return new THREE.MeshStandardMaterial({ color:0xD4AF37, metalness:1.0, roughness:0.32 }); }
    function brassMaterial(){ return new THREE.MeshStandardMaterial({ color:0xCCA63D, metalness:0.85, roughness:0.35 }); }
    function stoneMaterial(){ return new THREE.MeshStandardMaterial({ color:0xbfbab2, metalness:0.0, roughness:0.95 }); }
    function rockMaterial(){ return new THREE.MeshStandardMaterial({ color:0x9a9a9a, metalness:0.0, roughness:0.98 }); }
    function woodMaterial(){ return new THREE.MeshStandardMaterial({ color:0x6a4127, roughness:0.9, metalness:0.05 }); }
    function ironMaterial(){ return new THREE.MeshStandardMaterial({ color:0x6d6d70, metalness:0.8, roughness:0.35 }); }

    // ========== CATHOLIC EXHIBITS (Low-poly, symbolic) ==========

    // 1) Basilica / Cathedral (stylized facade + dome + cross)
    function buildBasilica(){
      const g = new THREE.Group();
      const mat = stoneMaterial();
      const base = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 0.6), mat); base.position.y = 0.45; g.add(base);

      const nave = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.7, 0.9), mat); nave.position.set(0, 0.35, -0.25); g.add(nave);

      // twin bell towers
      const towerGeo = new THREE.BoxGeometry(0.26, 1.35, 0.26);
      const L = new THREE.Mesh(towerGeo, mat), R = L.clone();
      L.position.set(-0.75, 0.67, 0.1); R.position.set(0.75, 0.67, 0.1);
      g.add(L,R);

      // dome
      const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,0.22,16), mat);
      drum.position.set(0, 0.95, -0.25);
      const dome = new THREE.Mesh(new THREE.SphereGeometry(0.34, 18, 12, 0, Math.PI*2, 0, Math.PI/2), mat);
      dome.position.set(0, 1.15, -0.25);
      g.add(drum, dome);

      // cross on top
      const cross = new THREE.Group();
      const vert = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.28, 0.04), goldMaterial());
      const hori = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.06, 0.04), goldMaterial());
      vert.position.y = 0.14; hori.position.y = 0.14;
      cross.add(vert, hori);
      cross.position.set(0, 1.55, -0.25);
      g.add(cross);

      g.userData.update = ()=>{ g.rotation.y += 0.02; };
      return g;
    }

    // 2) Crucifix (cross + simple corpus)
    function buildCrucifix(){
      const g = new THREE.Group();
      const wood = woodMaterial();
      const beamV = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.95, 0.06), wood); beamV.position.y = 0.48;
      const beamH = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.10, 0.06), wood); beamH.position.y = 0.60;
      g.add(beamV, beamH);

      const bodyMat = new THREE.MeshStandardMaterial({ color:0xd8c6b5, roughness:0.85, metalness:0.0 });
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.08, 14, 12), bodyMat); head.position.set(0, 0.72, 0.05);
      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.22, 6, 10), bodyMat); torso.position.set(0, 0.54, 0.05);
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.56,10), bodyMat); arm.rotation.z = Math.PI/2; arm.position.set(0, 0.60, 0.05);
      const cloth = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.10, 0.08), new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.9 })); cloth.position.set(0, 0.42, 0.06);
      g.add(head, torso, arm, cloth);

      g.userData.update = ()=>{ g.rotation.y += 0.05; };
      return g;
    }

    // 3) Rosary (beads + small cross)
    function buildRosary(){
      const g = new THREE.Group();
      const beadMat = new THREE.MeshStandardMaterial({ color:0x2a2a2f, roughness:0.65, metalness:0.2 });
      const ring = new THREE.Group();
      const R = 0.22;
      for (let i=0;i<20;i++){
        const a = (i/20)*Math.PI*2;
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 10), beadMat);
        b.position.set(Math.cos(a)*R, 0.10 + Math.sin(a)*0.02, Math.sin(a)*R);
        ring.add(b);
      }
      g.add(ring);

      const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.22,8), beadMat);
      chain.position.set(0, 0.02, -0.26);
      const cross = new THREE.Group();
      const v = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.18, 0.03), goldMaterial());
      const h = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.04, 0.03), goldMaterial());
      v.position.y = 0.09; h.position.y = 0.09;
      cross.add(v,h);
      cross.position.set(0, -0.12, -0.26);
      g.add(chain, cross);

      g.userData.update = ()=>{ ring.rotation.y += 0.05; };
      return g;
    }

    // 4) Holy Bible (closed book)
    function buildBible(){
      const g = new THREE.Group();
      const coverTex = (()=>{ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
        x.fillStyle='#3b0b12'; x.fillRect(0,0,256,256);
        x.fillStyle='#f1d27a'; x.font='bold 30px Inter, Arial';
        x.textAlign='center'; x.textBaseline='middle';
        x.fillText('HOLY',128,108); x.fillText('BIBLE',128,146);
        // small cross
        x.fillRect(124, 170, 8, 42);
        x.fillRect(108, 188, 40, 8);
        x.strokeStyle='#f1d27a'; x.lineWidth=8; x.strokeRect(18,18,220,220);
        const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;})();
      const coverMat = new THREE.MeshStandardMaterial({ map: coverTex, roughness:0.6, metalness:0.1 });
      const sideMat  = new THREE.MeshStandardMaterial({ color:0xcfbf9a, roughness:0.9, metalness:0.0 });
      const geo = new THREE.BoxGeometry(0.23, 0.04, 0.17);
      const mats = [sideMat, sideMat, sideMat, sideMat, coverMat, sideMat];
      const book  = new THREE.Mesh(geo, mats);
      book.position.y = 0.02; g.add(book);

      g.userData.update = ()=>{ book.rotation.y += 0.04; };
      return g;
    }

    // 5) Eucharist (chalice + host)
    function buildEucharist(){
      const g = new THREE.Group();
      const chalMat = goldMaterial();

      const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.10, 0.22, 18), chalMat);
      cup.position.y = 0.22;
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,0.14,14), chalMat);
      stem.position.y = 0.08;
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.18,0.06,18), chalMat);
      base.position.y = 0.03;
      g.add(cup, stem, base);

      const hostMat = new THREE.MeshStandardMaterial({ color:0xf7f2e8, roughness:0.95, metalness:0.0 });
      const host = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.02,24), hostMat);
      host.position.set(0, 0.42, -0.02);
      // cross imprint
      const cross = new THREE.Mesh(new THREE.BoxGeometry(0.02,0.12,0.01), new THREE.MeshStandardMaterial({ color:0xd8c9c0, roughness:1.0 }));
      const cross2 = new THREE.Mesh(new THREE.BoxGeometry(0.09,0.02,0.01), new THREE.MeshStandardMaterial({ color:0xd8c9c0, roughness:1.0 }));
      cross.position.set(0,0.42,0.0);
      cross2.position.set(0,0.42,0.0);
      g.add(host, cross, cross2);

      g.userData.update = ()=>{ g.rotation.y += 0.03; };
      return g;
    }

    // 6) Marian Statue (simple silhouette)
    function buildMary(){
      const g = new THREE.Group();
      const robeMat = new THREE.MeshStandardMaterial({ color:0x2c4b9a, roughness:0.85, metalness:0.05 });
      const veilMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.9, metalness:0.0 });
      const skinMat = new THREE.MeshStandardMaterial({ color:0xdcc7b7, roughness:0.85, metalness:0.0 });

      const robe = new THREE.Mesh(new THREE.ConeGeometry(0.20, 0.72, 14), robeMat); robe.position.y = 0.36;
      const veil = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.46, 14), veilMat); veil.position.y = 0.56;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.09, 14, 12), skinMat); head.position.y = 0.70;
      const halo = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.012, 10, 24), goldMaterial()); halo.position.y = 0.86; halo.rotation.x = Math.PI/2;

      g.add(robe, veil, head, halo);
      g.userData.update = ()=>{ g.rotation.y += 0.02; };
      return g;
    }

    // 7) Baptismal Font (stone bowl + water)
    function buildFont(){
      const g = new THREE.Group();
      const stone = rockMaterial();
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.22,0.12,18), stone); base.position.y = 0.06;
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.10,0.12,0.22,18), stone); stem.position.y = 0.23;
      const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.22,0.12,20), stone); bowl.position.y = 0.40;
      g.add(base, stem, bowl);

      const water = new THREE.Mesh(
        new THREE.CylinderGeometry(0.235,0.235,0.02,20),
        new THREE.MeshStandardMaterial({ color:0x9fd0ff, transparent:true, opacity:0.55, roughness:0.2, metalness:0.0 })
      );
      water.position.y = 0.45;
      g.add(water);

      g.userData.update = (t)=>{ water.position.y = 0.45 + Math.sin(t*2.2)*0.004; };
      return g;
    }

    // 8) Stained Glass (mini window panel)
    function buildStainedMini(){
      const g = new THREE.Group();
      const frame = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.76, 0.04), new THREE.MeshStandardMaterial({ color:0x2a2a2e, roughness:0.85 }));
      const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.40, 0.70), new THREE.MeshStandardMaterial({
        map: stainedTex, emissive:0x222222, emissiveIntensity:0.7, roughness:0.7, metalness:0.0
      }));
      glass.position.z = 0.03;
      g.add(frame, glass);
      g.userData.update = ()=>{ g.rotation.y += 0.03; };
      return g;
    }

    // 9) Thurible (incense censer) with gentle swing
    function buildThurible(){
      const g = new THREE.Group();
      const mat = brassMaterial();

      const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.16, 18, 12, 0, Math.PI*2, 0, Math.PI*0.65), mat);
      bowl.position.y = 0.20;

      const lid = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.18, 18), mat);
      lid.position.y = 0.34;

      const top = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 10), mat);
      top.position.y = 0.44;

      // little "holes" dots (visual hint)
      const holeMat = new THREE.MeshStandardMaterial({ color:0x1a1a1d, roughness:1.0 });
      for (let i=0;i<10;i++){
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.01, 10, 8), holeMat);
        const a = (i/10)*Math.PI*2;
        dot.position.set(Math.cos(a)*0.12, 0.22 + (i%2)*0.03, Math.sin(a)*0.12);
        g.add(dot);
      }

      const chain = new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.36,10), ironMaterial());
      chain.position.y = 0.62;

      g.add(bowl, lid, top, chain);

      g.userData._phase = Math.random()*10;
      g.userData.update = (t)=>{
        const s = Math.sin(t*1.4 + g.userData._phase) * 0.35;
        g.rotation.z = s*0.35;
        g.rotation.y += 0.02;
      };
      return g;
    }

    // 10) Church Bell (swinging)
    function buildBell(){
      const g = new THREE.Group();
      const mat = brassMaterial();

      const bell = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.30, 20), mat);
      bell.position.y = 0.30;

      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.02, 10, 24), mat);
      rim.position.y = 0.16; rim.rotation.x = Math.PI/2;

      const clapper = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), ironMaterial());
      clapper.position.y = 0.20;

      const hanger = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.10,12), mat);
      hanger.position.y = 0.48;

      g.add(bell, rim, clapper, hanger);

      g.userData._phase = Math.random()*10;
      g.userData.update = (t)=>{
        g.rotation.z = Math.sin(t*1.2 + g.userData._phase) * 0.25;
      };
      return g;
    }

    // ===== Place exhibits (two rows down the hall) =====
    const exBasilica = addExhibit({ name:'Cathedral', sub:'House of Worship', pos:{x:-6.5, y:0, z:-10}, buildMesh: buildBasilica });
    const exCrux    = addExhibit({ name:'Crucifix', sub:'Sign of Faith', pos:{x:-2.5, y:0, z:-12}, buildMesh: buildCrucifix });
    const exRosary  = addExhibit({ name:'Rosary', sub:'Prayer Beads', pos:{x: 1.0, y:0, z:-14}, buildMesh: buildRosary });
    const exBible   = addExhibit({ name:'Holy Bible', sub:'Sacred Scripture', pos:{x: 4.5, y:0, z:-12}, buildMesh: buildBible });

    const exEuch    = addExhibit({ name:'Eucharist', sub:'Chalice & Host', pos:{x:-6.5, y:0, z:-22}, buildMesh: buildEucharist });
    const exMary    = addExhibit({ name:'Our Lady', sub:'Marian Statue', pos:{x:-2.5, y:0, z:-24}, buildMesh: buildMary });
    const exFont    = addExhibit({ name:'Baptismal Font', sub:'Water & New Life', pos:{x: 1.0, y:0, z:-26}, buildMesh: buildFont, spotlight:false });
    const exGlass   = addExhibit({ name:'Stained Glass', sub:'Light & Color', pos:{x: 4.5, y:0, z:-24}, buildMesh: buildStainedMini });

    const exThur    = addExhibit({ name:'Thurible', sub:'Incense Censer', pos:{x:-1.0, y:0, z:-34}, buildMesh: buildThurible });
    const exBell    = addExhibit({ name:'Church Bell', sub:'Call to Prayer', pos:{x: 3.0, y:0, z:-34}, buildMesh: buildBell });

    // ========== VR Helpers ==========
    const controller = renderer.xr.getController(0);
    xrRig.add(controller);
    const controllerGeo = new THREE.BufferGeometry().setFromPoints([ new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1) ]);
    const controllerRay = new THREE.Line(controllerGeo, new THREE.LineBasicMaterial({ transparent:true, opacity:0.9 }));
    controllerRay.name = 'controllerRay'; controllerRay.scale.z = 10; controller.add(controllerRay);

    const reticle = new THREE.Mesh(new THREE.RingGeometry(0.15, 0.17, 32), new THREE.MeshBasicMaterial({ transparent:true, opacity:0.85, side:THREE.DoubleSide }));
    reticle.rotation.x = -Math.PI/2; reticle.visible = false; scene.add(reticle);

    const tempMatrix = new THREE.Matrix4();
    function intersectController(ctrl, objects){
      tempMatrix.identity().extractRotation(ctrl.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(ctrl.matrixWorld);
      raycaster.ray.direction.set(0,0,-1).applyMatrix4(tempMatrix);
      const hits = raycaster.intersectObjects(objects, true);
      return hits[0] || null;
    }
    function tryTeleport(){
      if (!renderer.xr.isPresenting) return;
      const hit = intersectController(controller, [floor]);
      if (hit){ xrRig.position.set(hit.point.x, 0, hit.point.z); }
    }
    controller.addEventListener('select', tryTeleport);

    // Pointer focus (dblclick / double-tap)
    function setPointer(e){
      const rect = renderer.domElement.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      pointer.x = ((cx - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
    }
    function focusAtPointer(e){
      setPointer(e); raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(
        [exBasilica, exCrux, exRosary, exBible, exEuch, exMary, exFont, exGlass, exThur, exBell, floor],
        true
      );
      if (!hits.length) return;
      const p = hits[0].point;
      const dist = camera.position.distanceTo(controls.target);
      const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
      const newCamPos = new THREE.Vector3().copy(p).addScaledVector(dir, dist);
      const start = performance.now();
      const fromCam = camera.position.clone();
      const fromTgt = controls.target.clone();
      const ease = t => 1 - Math.pow(1 - t, 3);
      (function step(now){
        const t = Math.min(1, (now - start) / 420);
        const e2 = ease(t);
        camera.position.lerpVectors(fromCam, newCamPos, e2);
        controls.target.lerpVectors(fromTgt, p, e2);
        if (t < 1) requestAnimationFrame(step);
      })(start);
    }
    renderer.domElement.addEventListener('dblclick', focusAtPointer, { passive:true });
    let lastTapTime = 0, lastTapX=0, lastTapY=0;
    renderer.domElement.addEventListener('touchend', (e)=>{
      if (!e.changedTouches || e.changedTouches.length!==1) return;
      const touch = e.changedTouches[0];
      const now = performance.now();
      const dt = now - lastTapTime;
      const dx = touch.clientX - lastTapX;
      const dy = touch.clientY - lastTapY;
      lastTapTime = now; lastTapX = touch.clientX; lastTapY = touch.clientY;
      if (dt < 320 && (dx*dx+dy*dy) < (24*24)) focusAtPointer({ touches:[touch] });
    }, { passive:true });

    // Animation clock
    const clock = new THREE.Clock();

    function renderLoop(){
      const t = clock.getElapsedTime();
      controls.update();

      const tgt = controls.target;
      tgt.x = Math.max(-8, Math.min(8, tgt.x));
      tgt.y = Math.max(0.5, Math.min(3.5, tgt.y));
      tgt.z = Math.max(-120, Math.min(-6, tgt.z));

      // per-exhibit updates
      [exBasilica, exCrux, exRosary, exBible, exEuch, exMary, exFont, exGlass, exThur, exBell].forEach(g=>{
        if (g.userData.update) g.userData.update(t);
        // also allow the built mesh itself to have update
        const mesh = g.children.find(ch => ch && ch.isObject3D && ch.userData && ch.userData.update);
        if (mesh && mesh.userData.update) mesh.userData.update(t);
        // if the built mesh is second child (after pedestal), update it too
        const built = g.children[1];
        if (built && built.userData && built.userData.update) built.userData.update(t);
      });

      if (renderer.xr.isPresenting){
        const hit = intersectController(controller, [floor]);
        if (hit){ reticle.position.copy(hit.point); reticle.visible = true; } else { reticle.visible = false; }
      } else { reticle.visible = false; }

      renderer.render(scene, camera);
    }
    renderer.setAnimationLoop(renderLoop);

    // UI: Single VR button
    const vrBtn = document.getElementById('vrBtn');
    let currentSession = null;
    if (vrBtn){
      vrBtn.addEventListener('click', async ()=>{
        if (!('xr' in navigator)){
          alert('WebXR not supported on this device/browser. Try Chrome on Android or the Quest Browser.');
          return;
        }
        if (!currentSession){
          try {
            const session = await navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] });
            currentSession = session;
            session.addEventListener('end', ()=>{ currentSession = null; vrBtn.textContent = 'Enter VR'; });
            await renderer.xr.setSession(session);
            vrBtn.textContent = 'Exit VR';
          } catch (e) {
            console.warn('VR start failed:', e);
            alert('Unable to start VR: ' + (e?.message ?? e));
          }
        } else { currentSession.end(); }
      });
    }
  </script>
</body>
</html>
