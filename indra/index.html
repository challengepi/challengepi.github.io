<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <meta name="description" content="A private, offline-first vocabulary spaced-repetition app." />
  <title>VocabLoop</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Private · local-first</p>
        <h1 id="page-title">VocabLoop</h1>
      </div>
      <button id="quick-add" class="icon-btn" type="button" aria-label="Add a word">+</button>
    </header>

    <main id="main" class="main" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-btn active" data-view="home" type="button"><span>⌂</span><small>Home</small></button>
      <button class="nav-btn" data-view="review" type="button"><span>◫</span><small>Review</small></button>
      <button class="nav-btn reel-nav" data-view="reels" type="button"><span>▥</span><small>Reels</small></button>
      <button class="nav-btn" data-view="words" type="button"><span>≡</span><small>Words</small></button>
      <button class="nav-btn" data-view="stats" type="button"><span>↗</span><small>Stats</small></button>
      <button class="nav-btn" data-view="settings" type="button"><span>⚙</span><small>Data</small></button>
    </nav>
  </div>

  <dialog id="word-dialog" class="sheet">
    <form id="word-form" method="dialog">
      <div class="sheet-head">
        <button value="cancel" class="text-btn" type="button" id="word-cancel">Cancel</button>
        <h2 id="word-dialog-title">Add word</h2>
        <button class="text-btn strong" type="submit">Save</button>
      </div>
      <input type="hidden" id="word-id" />
      <label>
        <span>Word</span>
        <input id="word-input" autocomplete="off" autocapitalize="none" maxlength="120" required placeholder="ephemeral" />
      </label>
      <label>
        <span>Meaning</span>
        <textarea id="meaning-input" rows="6" maxlength="1200" required placeholder="lasting for a very short time"></textarea>
      </label>
      <div id="duplicate-note" class="note hidden" role="status"></div>
      <label class="switch-row edit-only hidden" id="reset-row">
        <span><strong>Reset learning</strong><small>Treat this edited card as new.</small></span>
        <input id="reset-learning" type="checkbox" />
      </label>
      <button id="delete-word" class="btn danger edit-only hidden" type="button" style="width:100%;margin-top:20px">Delete word</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="live-status" class="sr-only" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept=".json,.gz,.json.gz,application/json,application/gzip" hidden />

  <script src="app.js" defer></script>
</body>
</html>
